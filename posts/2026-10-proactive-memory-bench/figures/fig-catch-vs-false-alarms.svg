<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 324" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Catch rate vs false alarms on paired probes</title>
<style>
text{font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.grid{stroke:#2c3331;stroke-width:1}.axis{stroke:#99a39f;stroke-width:1}
.ref{stroke:#99a39f;stroke-width:1.5;stroke-dasharray:4 4}
.tick{fill:#99a39f;font-size:12px}.cat{fill:#e3e8e5;font-size:13px}.lab{fill:#e3e8e5;font-size:13px}
.s1{fill:#3987e5}.s2{fill:#d95926}.dot{fill:#3987e5;stroke:#141817;stroke-width:2}
</style>
<line class="grid" x1="60" x2="610" y1="280.0" y2="280.0"/><text class="tick" x="52" y="284.0" text-anchor="end">0%</text>
<line class="grid" x1="60" x2="610" y1="215.0" y2="215.0"/><text class="tick" x="52" y="219.0" text-anchor="end">25%</text>
<line class="grid" x1="60" x2="610" y1="150.0" y2="150.0"/><text class="tick" x="52" y="154.0" text-anchor="end">50%</text>
<line class="grid" x1="60" x2="610" y1="85.0" y2="85.0"/><text class="tick" x="52" y="89.0" text-anchor="end">75%</text>
<line class="grid" x1="60" x2="610" y1="20.0" y2="20.0"/><text class="tick" x="52" y="24.0" text-anchor="end">100%</text>
<text class="tick" x="60.0" y="298" text-anchor="middle">0%</text>
<text class="tick" x="217.1" y="298" text-anchor="middle">10%</text>
<text class="tick" x="374.3" y="298" text-anchor="middle">20%</text>
<text class="tick" x="531.4" y="298" text-anchor="middle">30%</text>
<line class="axis" x1="60" x2="610" y1="280" y2="280"/>
<text class="cat" x="335" y="318" text-anchor="middle">False alarms: correct version flagged</text>
<text class="cat" transform="translate(15,150) rotate(-90)" text-anchor="middle">Catches: wrong version flagged</text>
<text class="tick" x="68" y="34">↖ better</text>
<circle class="dot" cx="154.3" cy="264.4" r="5.5"><title>No memory: catches 6%, false alarms 6%</title></circle>
<text class="lab" x="163.3" y="268.4" text-anchor="start">No memory</text>
<circle class="dot" cx="484.3" cy="92.8" r="5.5"><title>Per message: catches 72%, false alarms 27%</title></circle>
<text class="lab" x="493.3" y="96.8" text-anchor="start">Per message</text>
<circle class="dot" cx="295.7" cy="100.6" r="5.5"><title>6-msg window: catches 69%, false alarms 15%</title></circle>
<text class="lab" x="286.7" y="117.6" text-anchor="end">6-msg window</text>
<circle class="dot" cx="342.9" cy="100.6" r="5.5"><title>True reply links: catches 69%, false alarms 18%</title></circle>
<text class="lab" x="348.9" y="119.6" text-anchor="start">True reply links</text>
<circle class="dot" cx="358.6" cy="92.8" r="5.5"><title>Topic segments: catches 72%, false alarms 19%</title></circle>
<text class="lab" x="367.6" y="85.8" text-anchor="start">Topic segments</text>
<circle class="dot" cx="374.3" cy="66.8" r="5.5"><title>Rewrite: catches 82%, false alarms 20%</title></circle>
<text class="lab" x="374.3" y="54.8" text-anchor="middle">Rewrite</text>
<circle class="dot" cx="185.7" cy="87.6" r="5.5"><title>Grep agent: catches 74%, false alarms 8%</title></circle>
<text class="lab" x="176.7" y="91.6" text-anchor="end">Grep agent</text>
<circle class="dot" cx="531.4" cy="30.4" r="5.5"><title>Oracle: catches 96%, false alarms 30%</title></circle>
<text class="lab" x="521.4" y="34.4" text-anchor="end">Oracle</text>
</svg>