<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Retrieval accuracy by chunker, proactive vs reactive query</title>
